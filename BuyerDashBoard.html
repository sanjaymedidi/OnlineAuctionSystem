<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - Online Auction System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: url("https://i.pinimg.com/736x/40/cd/08/40cd0802c8df381364cf0a9bdb34ab3e.jpg");
            background-repeat: no-repeat;
            background-size: cover;
        }
        form {
            background-color: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0,0,0,5);
            width: 100%;
            max-width: 500px;
            margin-top: 10px;
            margin-bottom: 10px;
            margin-left: -750px;
           
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            margin-bottom: 8px;
            font-weight: 600;
            display: block;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        textarea {
            resize: none;
        }
        button {
            background-color: #28a745;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <form id="addProductForm" action="addProductForm.jsp">
        <h2>Add Product</h2>
		
        <label for="brand">Brand Name:</label>
        <input type="text" id="brand" name="brand" placeholder="Enter brand name" required>

        <label for="color">Color:</label>
        <input type="text" id="color" name="color" placeholder="Enter color" required>

        <label for="category">Category:</label>
        <select id="category" name="category" required>
            <option value="" disabled selected>Select category</option>
            <option value="Electronics">Electronics</option>
            <option value="Furnitures">Furnitures</option>
            <option value="Cloths">Cloths</option>
            <option value="Others">Others</option>
        </select>

        <label for="condition">Condition:</label>
        <select id="condition" name="condition" required>
            <option value="" disabled selected>Select condition</option>
            <option value="New">New</option>
            <option value="Used">Used</option>
            <option value="Refurbished">Refurbished</option>
        </select>

        <label for="warranty">Warranty:</label>
        <input type="text" id="warranty" name="warranty" placeholder="Mention months/years" required>

        <label for="manufactureYear">Year of Manufacturing:</label>
        <input type="number" id="manufactureYear" name="manufactureYear" placeholder="Enter year of manufacturing" required>

        <label for="description">Product Description:</label>
        <textarea id="description" name="description" rows="4" placeholder="Enter product description" required></textarea>

        <button type="submit">Add Product</button>
    </form>

</body>
</html>
